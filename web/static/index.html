<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Informes financieros</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1d2330; --muted: #6b7280;
    --border: #e3e6eb; --accent: #1f6f50; --accent-hover: #185a41;
    --error-bg: #fdecec; --error: #a12020; --ok-bg: #e9f6ef; --ok: #1f6f50;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c; --card: #1c2027; --text: #e7e9ee; --muted: #9aa1ad;
      --border: #2c313a; --accent: #3fae80; --accent-hover: #55c495;
      --error-bg: #3a1c1c; --error: #f2a3a3; --ok-bg: #17322a; --ok: #8fdcb9;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 760px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .row {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 10px;
  }
  .name { flex: 1 1 260px; font-weight: 600; word-break: break-word; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  label { color: var(--muted); font-size: 0.85rem; }
  input[type=date] {
    font: inherit; padding: 6px 8px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  button {
    font: inherit; font-weight: 600; padding: 7px 16px; border: 0; border-radius: 6px;
    background: var(--accent); color: #fff; cursor: pointer; min-width: 130px;
  }
  button:hover:not(:disabled) { background: var(--accent-hover); }
  button:disabled { opacity: 0.6; cursor: progress; }
  .msg { flex-basis: 100%; font-size: 0.9rem; padding: 8px 10px; border-radius: 6px; display: none; white-space: pre-wrap; }
  .msg.error { display: block; background: var(--error-bg); color: var(--error); }
  .msg.ok { display: block; background: var(--ok-bg); color: var(--ok); }
  .empty { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Informes financieros</h1>
  <p class="sub">Elige un informe y descárgalo en Excel. Las fechas incluyen ambos días. Las consultas grandes pueden tardar unos minutos.</p>
  <div id="lista"><p class="empty">Cargando informes…</p></div>
</main>

<script>
const hoy = new Date().toLocaleDateString('en-CA'); // YYYY-MM-DD local

function titulo(nombre) {
  return nombre.replace(/[-_]+/g, ' ');
}

async function cargar() {
  const lista = document.getElementById('lista');
  try {
    const res = await fetch('api/informes');
    const informes = await res.json();
    if (!informes.length) {
      lista.innerHTML = '<p class="empty">No hay archivos .sql en la carpeta Querys.</p>';
      return;
    }
    lista.innerHTML = '';
    for (const inf of informes) lista.appendChild(fila(inf));
  } catch (e) {
    lista.innerHTML = '<p class="empty">No se pudo cargar la lista de informes.</p>';
  }
}

function fila(inf) {
  const row = document.createElement('div');
  row.className = 'row';

  const name = document.createElement('div');
  name.className = 'name';
  name.textContent = titulo(inf.nombre);
  row.appendChild(name);

  const controls = document.createElement('div');
  controls.className = 'controls';
  const fechas = {};
  if (inf.usa_fecha_inicio) {
    fechas.inicio = campoFecha(controls, 'i_' + inf.nombre, 'Desde', inf.inicio_default || primerDiaDelMes());
  }
  if (inf.usa_fecha_fin) {
    fechas.fin = campoFecha(controls, 'f_' + inf.nombre, 'Hasta', hoy);
  }
  const btn = document.createElement('button');
  btn.textContent = 'Descargar Excel';
  controls.appendChild(btn);
  row.appendChild(controls);

  const msg = document.createElement('div');
  msg.className = 'msg';
  row.appendChild(msg);

  btn.addEventListener('click', () => descargar(inf, fechas, btn, msg));
  return row;
}

function campoFecha(contenedor, id, texto, valor) {
  const label = document.createElement('label');
  label.htmlFor = id;
  label.textContent = texto;
  const input = document.createElement('input');
  input.type = 'date';
  input.id = id;
  input.value = valor;
  input.max = hoy;
  contenedor.append(label, input);
  return input;
}

function primerDiaDelMes() {
  return hoy.slice(0, 8) + '01';
}

async function descargar(inf, fechas, btn, msg) {
  msg.className = 'msg';
  const params = new URLSearchParams();
  for (const [clave, input] of Object.entries(fechas)) {
    if (!input.value) { mostrar(msg, 'error', 'Completa las fechas.'); return; }
    params.set(clave, input.value);
  }
  if (fechas.inicio && fechas.fin && fechas.inicio.value > fechas.fin.value) {
    mostrar(msg, 'error', 'La fecha "Desde" no puede ser posterior a "Hasta".');
    return;
  }
  let url = 'api/informes/' + encodeURIComponent(inf.nombre);
  if ([...params].length) url += '?' + params;
  btn.disabled = true;
  btn.textContent = 'Generando…';
  const inicio = Date.now();
  try {
    const res = await fetch(url);
    if (!res.ok) {
      let detalle = 'Error ' + res.status;
      try {
        const d = (await res.json()).detail;
        if (typeof d === 'string') detalle = d;
      } catch (_) {}
      throw new Error(detalle);
    }
    const blob = await res.blob();
    const nombre = nombreArchivo(res) || inf.nombre + '.xlsx';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = nombre;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    const filas = res.headers.get('X-Filas');
    const seg = ((Date.now() - inicio) / 1000).toFixed(1);
    mostrar(msg, 'ok', `Descargado ${nombre}` + (filas ? ` · ${filas} filas` : '') + ` · ${seg} s`);
  } catch (e) {
    mostrar(msg, 'error', e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Descargar Excel';
  }
}

function nombreArchivo(res) {
  const cd = res.headers.get('Content-Disposition') || '';
  const m = cd.match(/filename\*=UTF-8''([^;]+)/i);
  return m ? decodeURIComponent(m[1]) : null;
}

function mostrar(el, tipo, texto) {
  el.className = 'msg ' + tipo;
  el.textContent = texto;
}

cargar();
</script>
</body>
</html>
